# Read the Docs build configuration: https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

# The package itself is not installed: building its Cython extension needs
# OpenMP and -march=native. conf.py puts the source tree on sys.path instead.
python:
  install:
    - requirements: docs/requirements.txt
